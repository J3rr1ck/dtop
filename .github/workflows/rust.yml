name: Weekly Build & Release

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  push:
    branches: [ master ]
    tags:
      - 'v*' # Trigger on version tags
  pull_request:
    branches: [ master ]
  workflow_dispatch: # Allow manual trigger

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common wget
        wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
        sudo dpkg -i cuda-keyring_1.1-1_all.deb
        sudo apt-get update
        sudo apt-get install -y cuda-nvml-dev-12-8
    
    - name: Build
      run: cargo build --verbose --release
    
    - name: Run tests
      run: cargo test --verbose

    - name: Package Binary
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      run: |
        cd target/release
        mv danger-monitor danmon
        tar -czvf danger-monitor-linux-x86_64.tar.gz danmon
        sha256sum danger-monitor-linux-x86_64.tar.gz > danger-monitor-linux-x86_64.sha256

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          target/release/danger-monitor-linux-x86_64.tar.gz
          target/release/danger-monitor-linux-x86_64.sha256
        draft: false
        prerelease: false
        generate_release_notes: true
